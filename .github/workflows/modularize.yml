name: Modularize Survival Skies

on:
  push:
    paths:
      - "scripts/modularize.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  modularize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Split index.html
        run: node scripts/modularize.mjs

      - name: Commit generated modules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css/main.css js/
          if git diff --cached --quiet; then
            echo "No modularization changes needed."
            exit 0
          fi
          git commit -m "chore: modularize Survival Skies"
          git push
